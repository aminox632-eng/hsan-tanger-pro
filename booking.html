<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0e0e0e"><meta name="robots" content="index,follow"><meta property="og:type" content="website"><meta property="og:site_name" content="HILAQ"><meta property="og:image" content="images/hero.svg"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>✂️</text></svg>"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link rel="stylesheet" href="css/style.css"><title>Réserver un rendez-vous | HILAQ Barber Shop</title><meta name="description" content="Réservez en ligne votre créneau chez HILAQ : choisissez service, barber, date et heure."><meta property="og:title" content="Réserver un rendez-vous | HILAQ Barber Shop"><meta property="og:description" content="Réservez en ligne votre créneau chez HILAQ : choisissez service, barber, date et heure."><link rel="canonical" href="https://www.hilaq.ma/booking.html"><link rel="stylesheet" href="style.css"></head>
<body><header id="site-header"></header>
<main><div class="page-hero"><div class="container"><h1 class="title">Réserver un rendez-vous</h1><p class="lead" style="margin:auto">Choisissez votre créneau, nous confirmons tout de suite.</p></div></div><section><div class="container" style="max-width:820px"><div class="panel"><form id="booking-form" class="form" novalidate>
<div><label for="n">Nom complet</label><input id="n" name="name" data-rule="name" autocomplete="name"><span class="err"></span></div>
<div><label for="p">Téléphone</label><input id="p" name="phone" type="tel" data-rule="phone" autocomplete="tel" placeholder="06 12 34 56 78"><span class="err"></span></div>
<div class="full"><label for="e">Email</label><input id="e" name="email" type="email" data-rule="email" autocomplete="email"><span class="err"></span></div>
<div><label for="s">Service</label><select id="s" name="service" data-rule="req"></select><span class="err"></span></div>
<div><label for="b">Barber préféré</label><select id="b" name="barber"></select><span class="err"></span></div>
<div><label for="d">Date</label><input id="d" name="date" type="date" data-rule="date"><span class="err"></span></div>
<div><label for="t">Heure</label><select id="t" name="time" data-rule="req"></select><span class="err"></span></div>
<div class="full"><label for="m">Message (facultatif)</label><textarea id="m" name="message"></textarea></div>
<div class="full"><button class="btn" type="submit">Confirmer la réservation</button></div></form>
<div class="ok" role="status"><i class="fa-solid fa-circle-check"></i><h2 class="title">Réservation confirmée</h2><p id="ok-text" class="lead"></p><p style="margin-top:24px"><a class="btn ghost" href="index.html">Retour à l’accueil</a></p></div></div></div></section></main>
<footer id="site-footer"></footer><div id="toasts" aria-live="polite"></div><button id="top" aria-label="Retour en haut"><i class="fa-solid fa-chevron-up"></i></button><script src="script.js"></script></body></html>
